{% extends "base.html" %}

{% block contenido %}
    <div class="header-icon-container verde">
        <i class="fa-solid fa-file-signature"></i>
    </div>
    <h2 class="titulo">Nueva Meta</h2>
    <p class="subtitulo-main">Registra los datos de tu plan de ahorro</p>
    
    {% if mensaje %}
        <div class="{% if 'Error' in mensaje %}alerta{% else %}exito{% endif %}">
            {{ mensaje }}
        </div>
    {% endif %}

    <form method="POST" action="/insertar">
        <div class="form-grid">
            <div class="form-group full">
                <label>ID Usuario</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-user"></i>
                    <input type="number" name="id_usuario" placeholder="Ej: 10234" required>
                </div>
            </div>
            
            <div class="form-group">
                <label>Meta ($)</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-sack-dollar"></i>
                    <input type="number" step="0.01" name="meta" placeholder="Ej: 5000" required>
                </div>
            </div>
            
            <div class="form-group">
                <label>Plazo (Meses)</label>
                <div class="input-wrapper">
                    <i class="fa-regular fa-calendar-days"></i>
                    <input type="number" name="plazo" placeholder="Ej: 12" required>
                </div>
            </div>
            
            <div class="form-group">
                <label>Aporte Extra ($)</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-money-bill-trend-up"></i>
                    <input type="number" step="0.01" name="extra" placeholder="Ej: 1000" required>
                </div>
            </div>
            
            <div class="form-group">
                <label>Mes Extra</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-thumbtack"></i>
                    <input type="number" name="mes_extra" placeholder="Ej: 6" required>
                </div>
            </div>
        </div>
        
        <button type="submit" class="btn-submit verde">
            <i class="fa-solid fa-cloud-arrow-up"></i> Guardar Meta
        </button>
    </form>
    
    <a href="/" class="btn-secundario">
        <i class="fa-solid fa-arrow-left"></i> Volver al menú
    </a>
{% endblock %}
