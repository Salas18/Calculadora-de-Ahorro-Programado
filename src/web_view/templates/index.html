{% extends "base.html" %}

{% block contenido %}
    <div class="header-icon-container azul">
        <i class="fa-solid fa-piggy-bank"></i>
    </div>
    
    <h1 class="titulo">Ahorro Programado</h1>
    <p class="subtitulo-main">Selecciona una opción para gestionar los registros</p>
    
    <a href="/crear-tablas" class="btn-opcion config">
        <div class="btn-icon"><i class="fa-solid fa-server"></i></div>
        <div class="btn-texto">
            <span class="btn-titulo">Configurar BD</span>
            <span class="btn-desc">Crea las tablas en la nube</span>
        </div>
        <i class="fa-solid fa-chevron-right btn-chevron"></i>
    </a>

    <a href="/insertar" class="btn-opcion insertar">
        <div class="btn-icon"><i class="fa-solid fa-hand-holding-dollar"></i></div>
        <div class="btn-texto">
            <span class="btn-titulo">Insertar Meta</span>
            <span class="btn-desc">Registra un nuevo plan de ahorro</span>
        </div>
        <i class="fa-solid fa-chevron-right btn-chevron"></i>
    </a>

    <a href="/buscar" class="btn-opcion buscar">
        <div class="btn-icon"><i class="fa-solid fa-magnifying-glass-chart"></i></div>
        <div class="btn-texto">
            <span class="btn-titulo">Buscar Meta</span>
            <span class="btn-desc">Consulta los datos por ID</span>
        </div>
        <i class="fa-solid fa-chevron-right btn-chevron"></i>
    </a>
{% endblock %}
